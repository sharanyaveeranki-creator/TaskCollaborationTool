```html
{% extends "base.html" %}

{% block title %}Register | TaskFlow{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Create Account</h1>
    <p>Join TaskFlow and organize your work.</p>

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required maxlength="80">

        <label>Password</label>
        <input type="password" name="password" required minlength="6">

        <button type="submit">Register</button>
    </form>

    <p class="switch-link">
        Already registered? <a href="{{ url_for('login') }}">Log in</a>
    </p>
</div>
{% endblock %}
```
